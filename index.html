<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="index.css">
    <script src="script.js"></script>
</head>
<body>
  <div class="form-container">
    <h2>REGISTRATION</h2>
  
    <form >
      <label for="name">Name:</label>
      <input type="text" name="name" id="name" placeholder="Enter your name"><br><br>

      <label for="email">Email:</label>
      <input type="email" name="email" id="email" placeholder="Enter your email"><br><br>

      <label for="username">Username:</label>
      <input type="text" name="username" id="username" placeholder="Enter your username"><br><br>

      <label for="password">Password:</label>
      <input type="password" name="password" id="password" placeholder="Enter your password"><br><br>

      <label for="address">Address:</label>
      <input type="text" name="address" id="address" placeholder="Enter your address"><br><br>

      <label for="phone">Phone:</label>
      <input type="tel" name="phone" id="phone" placeholder="Enter your phone number"><br><br>

      <label for="gender">Gender:</label>
      <select name="gender" id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>  
      </select><br><br>
       <button type="button" onclick="handleSubmit(event)">Submit</button>
      <!-- <input type="submit" value="Submit"> -->
    </form>
  </div>
  <span></span>
</body>
</html>
